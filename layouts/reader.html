<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read Online — Impression Editions</title>
<style>
:root { --active-bg: rgba(0, 0, 0, .05); }
@supports (color-scheme: light dark) {
    @media (prefers-color-scheme: dark) {
        :root { --active-bg: rgba(255, 255, 255, .1); }
    }
}
html { height: 100%; }
body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
#top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 101;
    display: none; align-items: center; gap: 0.5em; padding: 0.5em;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
}
@supports (color-scheme: light dark) {
    @media (prefers-color-scheme: dark) {
        #top-bar { background: rgba(30,30,30,0.9); }
        #side-bar { background: rgba(20,20,20,0.96); border-right-color: rgba(255,255,255,0.1); }
    }
}
#top-bar button { all: unset; cursor: pointer; padding: 0.4em 0.6em; border-radius: 4px; }
#top-bar button:hover { background: var(--active-bg); }
#side-bar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 102;
    width: min(380px, 80vw); display: none;
    background: rgba(255,255,255,0.96); backdrop-filter: blur(8px);
    border-right: 1px solid rgba(0,0,0,0.1); overflow: auto; padding: 1em;
}
#side-bar[data-open] { display: block; }
foliate-view { display: block; width: 100%; height: 100%; border: 0; }
#progress-slider {
    appearance: none; -webkit-appearance: none; height: 4px;
    background: rgba(0,0,0,0.1); border-radius: 2px; flex: 1;
}
#progress-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #666; cursor: pointer;
}
.loading { color: #888; font-size: 1.2em; text-align: center; padding-top: 40vh; }
#title-bar { margin-left: auto; margin-right: 1em; font-size: 0.85em; color: #888; }
</style>
</head>
<body>
<div id="top-bar">
    <button id="toc-button" aria-label="Contents">☰</button>
    <button id="prev-button" aria-label="Previous">←</button>
    <input type="range" id="progress-slider" min="0" max="100" value="0">
    <button id="next-button" aria-label="Next">→</button>
    <span id="percent-label" style="font-size:0.8em;color:#888;min-width:3em;text-align:right">0%</span>
    <span id="title-bar"></span>
</div>
<div id="side-bar"><div id="toc"></div></div>
<div class="loading" id="loading">Loading book…</div>
<script type="module">
import './foliate/view.js'

const params = new URLSearchParams(location.search)
const url = params.get('url')
const title = params.get('title') || 'Untitled'

document.title = title + ' — Read Online — Impression Editions'
document.getElementById('title-bar').textContent = title

const loading = document.getElementById('loading')
const topBar = document.getElementById('top-bar')
const sideBar = document.getElementById('side-bar')
const tocButton = document.getElementById('toc-button')
const prevButton = document.getElementById('prev-button')
const nextButton = document.getElementById('next-button')
const slider = document.getElementById('progress-slider')
const percentLabel = document.getElementById('percent-label')
const tocContainer = document.getElementById('toc')

const view = document.createElement('foliate-view')
document.body.append(view)

const open = async url => {
    try {
        const res = await fetch(url)
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const blob = await res.blob()
        await view.open(blob)
        loading.style.display = 'none'
        topBar.style.display = 'flex'
    } catch (e) {
        loading.innerHTML = `<p style="color:#c00">Failed to load book.</p><p style="font-size:0.85em">${e.message}</p>`
    }
}

view.addEventListener('relocate', e => {
    const { fraction } = e.detail
    slider.value = fraction * 100
    percentLabel.textContent = Math.round(fraction * 100) + '%'
})

prevButton.onclick = () => view.goLeft()
nextButton.onclick = () => view.goRight()
slider.oninput = () => view.goToFraction(parseFloat(slider.value) / 100)

tocButton.onclick = () => {
    sideBar.hasAttribute('data-open')
        ? sideBar.removeAttribute('data-open')
        : sideBar.setAttribute('data-open', '')
}

document.addEventListener('click', e => {
    if (!sideBar.contains(e.target) && e.target !== tocButton && sideBar.hasAttribute('data-open'))
        sideBar.removeAttribute('data-open')
})

document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return
    if (e.key === 'ArrowLeft') view.goLeft()
    if (e.key === 'ArrowRight') view.goRight()
    if (e.key === 'Escape') sideBar.removeAttribute('data-open')
})

view.addEventListener('ready', e => {
    const { book } = e.detail
    const buildTOC = (items, parent) => {
        const list = document.createElement('ol')
        list.style.cssText = 'list-style:none;padding-left:1em'
        for (const item of items) {
            const li = document.createElement('li')
            const a = document.createElement('a')
            a.textContent = item.label
            a.href = '#'
            a.style.cssText = 'color:inherit;text-decoration:none'
            a.onclick = async e => {
                e.preventDefault()
                await view.goTo(item.href)
                sideBar.removeAttribute('data-open')
            }
            li.append(a)
            if (item.subitems?.length) buildTOC(item.subitems, li)
            list.append(li)
        }
        parent.append(list)
    }
    buildTOC(book.toc, tocContainer)
    tocButton.style.display = 'block'
})

if (url) open(url).catch(e => console.error(e))
else loading.textContent = 'No book URL specified.'
</script>
</body>
</html>
