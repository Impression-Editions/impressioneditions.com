<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ .Site.BaseURL }}">
      <img src="/img/logo.svg" alt="Impression Editions" class="site-logo">
      <small>Free, carefully produced ebooks</small>
    </a>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
