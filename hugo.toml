baseURL = "https://impressioneditions.com/"
languageCode = "en-us"
title = "Impression Editions"
enableRobotsTXT = true

# Allow raw HTML (long-descriptions) inside markdown bodies.
[markup.goldmark.renderer]
unsafe = true

# sensible, fast defaults
[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[params]
  description = "Free, carefully produced ebooks in the spirit of Standard Ebooks."
  license = "CC BY-NC 4.0"
  licenseURL = "https://creativecommons.org/licenses/by-nc/4.0/"

